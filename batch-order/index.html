<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>批量录单小工具 · 地址/品名/规格 自动识别</title>
<script src="./xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f6f7fb; --card:#ffffff; --ink:#1f2430; --sub:#6b7280;
    --line:#eceef3; --accent:#ff8a3d; --accent-d:#f97316; --ok:#16a34a; --danger:#ef4444;
    --radius:16px; --shadow:0 6px 24px rgba(31,36,48,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#fbfcff,#f4f6fb);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 18px 60px}
  header.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-d));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;box-shadow:var(--shadow)}
  h1{font-size:20px;margin:0}
  .tag{display:inline-block;font-size:12px;color:var(--sub);background:var(--line);padding:2px 8px;border-radius:999px;margin-left:8px}
  .lead{color:var(--sub);font-size:13px;margin:4px 0 22px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:880px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .card h2 .n{width:22px;height:22px;border-radius:7px;background:var(--line);color:var(--accent-d);
    display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
  textarea,input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-size:14px;font-family:inherit;background:#fff;color:var(--ink);outline:none;transition:.15s}
  textarea{min-height:84px;resize:vertical}
  textarea:focus,input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,138,61,.15)}
  .row3{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
  @media(max-width:520px){.row3{grid-template-columns:1fr}}
  .hint{font-size:12px;color:var(--sub);margin-top:6px}
  .detect{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-size:11px;background:#fff4ec;color:var(--accent-d);border:1px solid #ffd9bd;padding:2px 8px;border-radius:999px}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  button{cursor:pointer;border:none;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;
    font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff}
  .btn-primary:hover{filter:brightness(1.05)}
  .btn-ghost{background:var(--line);color:var(--ink)}
  .btn-ghost:hover{background:#e4e7ee}
  .btn-danger{background:#fee2e2;color:var(--danger)}
  .btn-danger:hover{background:#fecaca}
  .filebox{border:1.5px dashed #d7dbe6;border-radius:12px;padding:14px;text-align:center;color:var(--sub);font-size:13px;cursor:pointer;background:#fafbff}
  .filebox:hover{border-color:var(--accent);color:var(--accent-d)}
  .filebox input{display:none}
  .mini{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;margin-top:10px}
  .preview{max-height:160px;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  .preview th,.preview td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  .preview th{background:#fafbff;position:sticky;top:0;font-weight:600;color:var(--sub)}
  .full{grid-column:1/-1}
  .bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px}
  .count{font-size:13px;color:var(--sub)}
  .count b{color:var(--accent-d);font-size:16px}
  .result{overflow:auto;border:1px solid var(--line);border-radius:12px}
  .result table{font-size:13px}
  .result th,.result td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  .result thead th{background:#fff7f1;color:var(--accent-d);position:sticky;top:0;font-weight:700}
  .result tbody tr:hover{background:#fffaf6}
  .del{background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px;padding:2px 6px}
  .del:hover{text-decoration:underline}
  .empty{color:var(--sub);text-align:center;padding:26px;font-size:13px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1f2430;color:#fff;
    padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hr{height:1px;background:var(--line);margin:16px 0;border:0}
  code{background:var(--line);padding:1px 5px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">录</div>
    <div>
      <h1>批量录单小工具 <span class="tag">离线 · 单文件</span></h1>
    </div>
  </header>
  <p class="lead">粘贴「地址,姓名,电话,品名,规格」自动拆分 → 上传产品表（自动识别品名/规格两列）生成下拉 → 一键添加到表格并导出 CSV。所有数据仅存本机浏览器，不上传任何服务器。</p>

  <div class="grid">
    <!-- 1. 快速录入 -->
    <section class="card">
      <h2><span class="n">1</span>快速录入（自动识别）</h2>
      <label>粘贴整段：地址,姓名,电话,品名,规格（支持 空格 / 中英文逗号 / 、 分隔，品名规格需先上传产品表才会识别）</label>
      <textarea id="rawInput" placeholder="例：北京市朝阳区建国路88号 张三 13800138000"></textarea>
      <div class="detect" id="detectChips"></div>
      <hr class="hr"/>
      <div class="row3">
        <div><label>地址</label><input id="f_address" placeholder="地址"/></div>
        <div><label>姓名</label><input id="f_name" placeholder="姓名"/></div>
        <div><label>电话</label><input id="f_phone" placeholder="电话"/></div>
      </div>
      <div class="hint">自动拆到各框（空格、逗号、顿号均可分隔）；若整段里带「品名/规格」且已在上传表里存在，会自动归位到对应下拉。也可直接手填。</div>
    </section>

    <!-- 2. 产品表（品名 + 规格） -->
    <section class="card">
      <h2><span class="n">2</span>上传产品表（品名 + 规格 两列）</h2>
      <label class="filebox" id="dropZone">点击或拖入 Excel / CSV 文件（.xlsx .xls .csv .tsv）
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.tsv,.txt"/>
      </label>
      <div class="mini">
        <span>或粘贴表格文本：</span>
      </div>
      <textarea id="pasteTable" style="margin-top:6px" placeholder="可直接粘贴从 Excel 复制的表格（Tab 分隔）"></textarea>
      <div class="mini" id="colWrap" style="display:none">
        <span>品名列：<select id="pinmingColSel" style="width:auto;display:inline-block;padding:4px 8px"></select></span>
        <span style="margin-left:8px">规格列：<select id="specColSel" style="width:auto;display:inline-block;padding:4px 8px"></select></span>
      </div>
      <div class="btns">
        <button class="btn-ghost" id="loadPaste">读取粘贴内容</button>
        <button class="btn-ghost" id="clearProducts">清空型号</button>
      </div>
      <div class="preview" id="preview"></div>
    </section>

    <!-- 3. 表单 + 添加 -->
    <section class="card full">
      <h2><span class="n">3</span>录入表单</h2>
      <div class="row3">
        <div><label>地址</label><input id="g_address" placeholder="地址"/></div>
        <div><label>姓名</label><input id="g_name" placeholder="姓名"/></div>
        <div><label>电话</label><input id="g_phone" placeholder="电话"/></div>
      </div>
      <div class="row3" style="margin-top:8px">
        <div><label>品名（来自上传表）</label>
          <select id="g_pinming"><option value="">— 请先上传产品表 —</option></select>
        </div>
        <div><label>规格 / 型号（来自上传表）</label>
          <select id="g_xinghao"><option value="">— 请先上传产品表 —</option></select>
        </div>
        <div><label>数量</label><input id="g_qty" type="number" min="1" value="1"/></div>
      </div>
      <div style="margin-top:8px"><button class="btn-primary" id="addBtn" style="width:100%">＋ 添加到表格</button></div>
      <div class="hint">点「添加到表格」会把上面内容追加到下方表格的对应列（表头同名自动对齐）。</div>
    </section>

    <!-- 4. 结果表格 -->
    <section class="card full">
      <div class="bar">
        <div class="count">已录入 <b id="rowCount">0</b> 条</div>
        <div class="btns" style="margin:0">
          <button class="btn-ghost" id="exportBtn">⬇ 导出 CSV</button>
          <button class="btn-ghost" id="copyBtn">📋 复制 JSON</button>
          <button class="btn-danger" id="clearTable">清空表格</button>
        </div>
      </div>
      <div class="result">
        <table id="resultTable">
          <thead><tr id="headRow"></tr></thead>
          <tbody id="body"></tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  // ---------- 配置：表头与字段（表单与表格共用，保证“表头同名自动对齐”）----------
  var COLUMNS = [
    {key:"address", label:"地址"},
    {key:"name",    label:"姓名"},
    {key:"phone",   label:"电话"},
    {key:"pinming", label:"品名"},
    {key:"xinghao", label:"规格"},
    {key:"qty",     label:"数量"}
  ];
  var LS_KEY = "batchOrderApp.rows.v1";
  var $ = function(id){ return document.getElementById(id); };

  // 渲染表头
  (function renderHead(){
    var tr = $("headRow");
    COLUMNS.forEach(function(c){ var th=document.createElement("th"); th.textContent=c.label; tr.appendChild(th); });
    var th=document.createElement("th"); th.textContent="操作"; tr.appendChild(th);
  })();

  // ---------- Toast ----------
  var toastTimer;
  function toast(msg){
    var t=$("toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove("show"); },1800);
  }

  // ---------- 1. 快速识别 ----------
  // 常见姓氏表：用于「姓氏开头优先判定为姓名」，避免地址里的词被误认成名字
  var SURNAMES="王李张刘陈杨黄赵周吴徐孙朱马胡郭林何高梁郑罗宋谢唐韩冯于董萧程曹袁邓许傅沈曾彭吕苏卢蒋蔡贾丁魏薛叶阎余潘杜戴夏钟汪田任姜范方石姚谭廖邹熊金陆郝孔白崔康毛邱秦江史顾侯邵孟龙万段雷钱汤尹黎易常武乔贺赖龚文";
  function nameScore(s){
    if(!/^[一-龥]+$/.test(s)) return -1;                              // 必须纯中文
    if(s.length<2 || s.length>4) return -1;                          // 姓名一般 2–4 字
    if(/[\d#栋号楼号路街巷弄层室单元区镇村组队]/u.test(s)) return -1; // 含地址特征字则不是姓名
    return (SURNAMES.indexOf(s.charAt(0))>=0) ? 100 : 10;            // 姓氏开头优先
  }
  function assignFromParts(parts){
    var phone="", name="", address="", pinming="", xinghao="";
    var phones = parts.filter(function(p){ return /^[\d][\d\-]{6,}$/.test(p); });
    if(phones.length) phone = phones[0];
    var rest = parts.filter(function(p){ return p!==phone; });
    // 先按上传表里的「品名 / 规格」列表归位
    var others=[];
    rest.forEach(function(t){
      if(pinmingList.indexOf(t)>=0 && !pinming){ pinming=t; }
      else if(specList.indexOf(t)>=0 && !xinghao){ xinghao=t; }
      else { others.push(t); }
    });
    if(others.length===1){
      // 仅剩两段（如“姓名 电话”）：像姓名就归姓名，否则归地址
      if(nameScore(others[0])>0){ name=others[0]; } else { address=others[0]; }
    }
    else if(others.length>=2){
      var best=null, bestScore=-1;
      others.forEach(function(t){ var sc=nameScore(t); if(sc>bestScore){ bestScore=sc; best=t; } });
      if(best && bestScore>0){ name=best; address=others.filter(function(t){return t!==best;}).join(" "); }
      else { address=others.join(" "); }
    }
    return {address:address, name:name, phone:phone, pinming:pinming, xinghao:xinghao};
  }
  function parseEntry(raw){
    var s=raw.trim();
    // 优先按显式分隔符（逗号/，/、/；/;）拆分
    var byDelim = s.split(/[,，、;；]/).map(function(x){return x.trim();}).filter(Boolean);
    if(byDelim.length>=2) return assignFromParts(byDelim);
    // 否则按「中间是空格」拆分
    var bySpace = s.split(/\s+/).map(function(x){return x.trim();}).filter(Boolean);
    if(bySpace.length>=2) return assignFromParts(bySpace);
    return {address:s, name:"", phone:"", pinming:"", xinghao:""};
  }
  function fillForm(o){
    $("f_address").value=o.address||"";
    $("f_name").value=o.name||"";
    $("f_phone").value=o.phone||"";
    // 同步到表单区
    $("g_address").value=o.address||"";
    $("g_name").value=o.name||"";
    $("g_phone").value=o.phone||"";
    if(o.pinming){ setSelect($("g_pinming"), o.pinming); rebuildSpecSelect(); }
    setSelect($("g_xinghao"), o.xinghao);
  }
  function setSelect(sel,v){
    if(!v){ sel.value=""; return; }
    for(var i=0;i<sel.options.length;i++){ if(sel.options[i].value===v){ sel.value=v; return; } }
    sel.value="";
  }
  $("rawInput").addEventListener("input", function(){
    var v=this.value.trim();
    if(!v){ $("detectChips").innerHTML=""; return; }
    var o=parseEntry(v);
    fillForm(o);
    var chips=[];
    if(o.address) chips.push("地址 ✓");
    if(o.name) chips.push("姓名 ✓");
    if(o.phone) chips.push("电话 ✓");
    if(o.pinming) chips.push("品名 ✓");
    if(o.xinghao) chips.push("规格 ✓");
    $("detectChips").innerHTML = chips.map(function(c){return '<span class="chip">'+c+'</span>';}).join("");
  });

  // ---------- 2. 产品表解析（品名 + 规格 两列）----------
  var parsedRows=[];      // 二维数组
  var parsedHeader=[];    // 表头
  var pinmingCol=0, specCol=1;
  var pinmingList=[], specList=[];   // 供快速录入框匹配用
  var pinmingToSpecs={};             // 品名 -> 该品名下的规格列表（去重），用于规格联动

  function detectDelim(text){
    var firstLine=(text.split(/\r?\n/)[0])||"";
    return (firstLine.indexOf("\t")>-1) ? "\t" : ",";
  }
  function parseCSV(text){
    var delim=detectDelim(text), rows=[], row=[], field="", i=0, inQ=false;
    while(i<text.length){
      var c=text[i];
      if(inQ){
        if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQ=false; i++; continue; }
        field+=c; i++; continue;
      } else {
        if(c==='"'){ inQ=true; i++; continue; }
        if(c===delim){ row.push(field); field=""; i++; continue; }
        if(c==='\r'){ i++; continue; }
        if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=""; i++; continue; }
        field+=c; i++;
      }
    }
    if(field.length||row.length){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return r.length && !(r.length===1 && r[0]===""); });
  }
  // 按表头关键词自动识别「品名列 / 规格列」
  function detectCol(keywords){
    for(var i=0;i<parsedHeader.length;i++){
      var h=(parsedHeader[i]||"").toLowerCase();
      for(var k=0;k<keywords.length;k++){ if(h.indexOf(keywords[k])>=0) return i; }
    }
    return -1;
  }
  function autoDetectCols(){
    var p=detectCol(["品名","名称","产品","货品","名字","name","product"]);
    var s=detectCol(["规格","型号","模型","spec","model","type","sku","尺寸"]);
    p = (p<0) ? (parsedHeader.length>0?0:-1) : p;
    s = (s<0) ? (parsedHeader.length>1?1:-1) : s;
    if(p===s){ p=0; s=1; }
    pinmingCol=p; specCol=s;
  }
  function handleMatrix(rows){
    if(!rows || !rows.length){ toast("没有解析到数据"); return; }
    parsedRows=rows;
    parsedHeader = rows[0].map(function(h,i){ return (h&&h.trim())?h.trim():("列"+(i+1)); });
    autoDetectCols();
    // 列选择器
    var pSel=$("pinmingColSel"), sSel=$("specColSel");
    pSel.innerHTML=""; sSel.innerHTML="";
    parsedHeader.forEach(function(h,i){
      var o1=document.createElement("option"); o1.value=i; o1.textContent=h; pSel.appendChild(o1);
      var o2=document.createElement("option"); o2.value=i; o2.textContent=h; sSel.appendChild(o2);
    });
    pSel.value=pinmingCol; sSel.value=specCol;
    $("colWrap").style.display="inline";
    rebuildProductSelect();
    renderPreview();
  }
  function buildSelect(sel, list, placeholder){
    var cur=sel.value; sel.innerHTML="";
    var ph=document.createElement("option"); ph.value=""; ph.textContent= list.length? placeholder : "— 无数据 —"; sel.appendChild(ph);
    list.forEach(function(v){ var op=document.createElement("option"); op.value=v; op.textContent=v; sel.appendChild(op); });
    if(cur) sel.value=cur;
  }
  function rebuildProductSelect(){
    pinmingCol=parseInt($("pinmingColSel").value,10);
    specCol=parseInt($("specColSel").value,10);
    var pset={}, plist=[];      // 品名：相同合并（去重）
    var sset={}, slist=[];      // 规格：每条独立，不按品名合并（完全相同的才去重）
    pinmingToSpecs={};
    parsedRows.forEach(function(r,idx){
      if(idx===0) return; // 首行为表头
      var p=(r[pinmingCol]||"").toString().trim();
      var s=(r[specCol]||"").toString().trim();
      if(p && !pset[p]){ pset[p]=1; plist.push(p); pinmingToSpecs[p]=[]; }
      if(p && s){
        var arr=pinmingToSpecs[p];
        if(arr.indexOf(s)<0) arr.push(s);   // 该品名下的规格逐条收集，不合并
      }
      if(s && !sset[s]){ sset[s]=1; slist.push(s); }
    });
    pinmingList=plist; specList=slist;
    buildSelect($("g_pinming"), plist, "— 选择品名 —");
    rebuildSpecSelect();   // 规格下拉联动品名
    toast("品名 "+plist.length+" 项 / 规格 "+slist.length+" 项");
  }
  // 规格下拉：根据已选品名过滤，只显示该品名的规格；未选品名时显示全部规格
  function rebuildSpecSelect(){
    var p=$("g_pinming").value;
    var list = p ? (pinmingToSpecs[p]||[]) : specList;
    var cur=$("g_xinghao").value;
    buildSelect($("g_xinghao"), list, p ? "— 该品名下规格 —" : "— 请先选择品名 —");
    if(cur && list.indexOf(cur)<0){ $("g_xinghao").value=""; } // 换品名后旧规格不在范围内则清空
  }
  function renderPreview(){
    var html="<table><thead><tr>";
    parsedHeader.forEach(function(h){ html+="<th>"+escapeHtml(h)+"</th>"; });
    html+="</tr></thead><tbody>";
    parsedRows.forEach(function(r,idx){
      if(idx===0) return; // 首行为表头
      if(idx>6) return;
      html+="<tr>"+r.map(function(c){return "<td>"+escapeHtml((c||"").toString())+"</td>";}).join("")+"</tr>";
    });
    html+="</tbody></table>";
    $("preview").innerHTML=html;
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m];}); }

  // 文件读取
  $("fileInput").addEventListener("change", function(e){
    var f=e.target.files[0]; if(!f) return; readFile(f);
  });
  function readFile(f){
    var name=f.name.toLowerCase();
    if(name.endsWith(".csv")||name.endsWith(".tsv")||name.endsWith(".txt")){
      var r=new FileReader(); r.onload=function(){ handleMatrix(parseCSV(r.result)); }; r.readAsText(f,"utf-8");
    } else if(name.endsWith(".xlsx")||name.endsWith(".xls")){
      if(typeof XLSX==="undefined"){ toast("Excel 解析库未加载，请用 CSV"); return; }
      var r2=new FileReader();
      r2.onload=function(){
        try{
          var wb=XLSX.read(new Uint8Array(r2.result),{type:"array"});
          var ws=wb.Sheets[wb.SheetNames[0]];
          var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
          rows=rows.filter(function(r){ return r && r.some(function(c){return (c!==""&&c!=null);}); });
          handleMatrix(rows);
        }catch(err){ toast("Excel 解析失败："+err.message); }
      };
      r2.readAsArrayBuffer(f);
    } else { toast("不支持的文件类型"); }
  }
  // 拖拽
  ["dragover","dragenter"].forEach(function(ev){ $("dropZone").addEventListener(ev,function(e){e.preventDefault();$("dropZone").style.borderColor="var(--accent)";}); });
  ["dragleave","drop"].forEach(function(ev){ $("dropZone").addEventListener(ev,function(e){e.preventDefault();$("dropZone").style.borderColor="#d7dbe6";}); });
  $("dropZone").addEventListener("drop",function(e){ var f=e.dataTransfer.files[0]; if(f) readFile(f); });

  $("loadPaste").addEventListener("click", function(){
    var t=$("pasteTable").value.trim(); if(!t){ toast("请先粘贴表格文本"); return; }
    handleMatrix(parseCSV(t));
  });
  $("pinmingColSel").addEventListener("change", rebuildProductSelect);
  $("specColSel").addEventListener("change", rebuildProductSelect);
  $("g_pinming").addEventListener("change", rebuildSpecSelect);
  $("clearProducts").addEventListener("click", function(){
    parsedRows=[]; parsedHeader=[]; pinmingList=[]; specList=[];
    $("colWrap").style.display="none"; $("preview").innerHTML="";
    buildSelect($("g_pinming"), [], "— 请先上传产品表 —");
    buildSelect($("g_xinghao"), [], "— 请先上传产品表 —");
    toast("已清空型号");
  });

  // ---------- 3 & 4. 表格增删 / 持久化 ----------
  var rows=[];
  function loadRows(){ try{ rows=JSON.parse(localStorage.getItem(LS_KEY)||"[]"); }catch(e){ rows=[]; } }
  function saveRows(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(rows)); }catch(e){} updateCount(); }
  function updateCount(){ $("rowCount").textContent=rows.length; }

  function render(){
    var tb=$("body"); tb.innerHTML="";
    if(!rows.length){ tb.innerHTML='<tr><td class="empty" colspan="'+(COLUMNS.length+1)+'">还没有数据，填好上面点「添加到表格」吧～</td></tr>'; updateCount(); return; }
    rows.forEach(function(r,idx){
      var tr=document.createElement("tr");
      COLUMNS.forEach(function(c){ var td=document.createElement("td"); td.textContent=r[c.key]||""; tr.appendChild(td); });
      var td=document.createElement("td");
      var b=document.createElement("button"); b.className="del"; b.textContent="删除";
      b.addEventListener("click",function(){ rows.splice(idx,1); saveRows(); render(); });
      td.appendChild(b); tr.appendChild(td);
      tb.appendChild(tr);
    });
    updateCount();
  }

  $("addBtn").addEventListener("click", function(){
    var o={
      address:$("g_address").value.trim(),
      name:$("g_name").value.trim(),
      phone:$("g_phone").value.trim(),
      pinming:$("g_pinming").value,
      xinghao:$("g_xinghao").value,
      qty:$("g_qty").value.trim()||"1"
    };
    if(!o.address && !o.name && !o.phone && !o.pinming && !o.xinghao){ toast("请先填写内容"); return; }
    rows.push(o); saveRows(); render();
    // 清空录入框（保留产品表与数量方便连续录）
    ["g_address","g_name","g_phone"].forEach(function(id){ $(id).value=""; });
    $("g_pinming").value=""; $("g_xinghao").value="";
    $("rawInput").value=""; $("detectChips").innerHTML="";
    toast("已添加到表格 ✓");
  });

  $("exportBtn").addEventListener("click", function(){
    if(!rows.length){ toast("表格为空"); return; }
    var lines=[COLUMNS.map(function(c){return c.label;}).join(",")];
    rows.forEach(function(r){ lines.push(COLUMNS.map(function(c){return csvCell(r[c.key]||"");}).join(",")); });
    var blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="录单数据_"+new Date().toISOString().slice(0,10)+".csv"; a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
    toast("已导出 CSV ✓");
  });
  function csvCell(v){ v=String(v); return /[",\r\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }

  $("copyBtn").addEventListener("click", function(){
    if(!rows.length){ toast("表格为空"); return; }
    var text=JSON.stringify(rows,null,2);
    if(navigator.clipboard){ navigator.clipboard.writeText(text).then(function(){toast("已复制 JSON ✓");},function(){toast("复制失败");}); }
    else toast("浏览器不支持复制");
  });

  $("clearTable").addEventListener("click", function(){
    if(!rows.length){ toast("已是空表"); return; }
    if(confirm("确定清空全部 "+rows.length+" 条记录？")){ rows=[]; saveRows(); render(); toast("已清空"); }
  });

  // 初始化
  loadRows(); render();
})();
</script>
</body>
</html>
